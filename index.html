  <script>
    (() => {
      const icon = document.querySelector('.linkedin');
      const scene = document.querySelector('.scene');
      const hero = document.querySelector('.hero');
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 96;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) return;
      let previewPixels, heroPixels, pending = false;
      const clamp = (v, max) => Math.max(0, Math.min(max, v));
      const linear = v => v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
      function update() {
        pending = false;
        if (!previewPixels) return;
        const r = scene.getBoundingClientRect();
        const box = icon.querySelector('svg').getBoundingClientRect();
        const failed = document.body.classList.contains('failed');
        const backWidth = Math.max(document.documentElement.clientWidth, r.width) + 96;
        const backLeft = Math.min(0, r.left) - 48;
        const card = failed ? document.querySelector('.intro').getBoundingClientRect() : null;
        if (!r.width) return;
        let luminance = 0;
        for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
          const x = box.left + (col + .5) * box.width / 3;
          const y = box.top + (row + .5) * box.height / 3;
          if (card && x >= card.left && x < card.right && y >= card.top && y < card.bottom) {
            luminance += 1; continue;
          }
          const sharp = !failed && x >= r.left && x < r.right && y >= r.top && y < r.bottom;
          const u = sharp ? (x - r.left) / r.width : (x - backLeft) / backWidth;
          const v = (y - r.top) / r.height;
          const pixels = sharp && heroPixels ? heroPixels : previewPixels;
          const i = (clamp(Math.floor(v * 96), 95) * 96 + clamp(Math.floor(u * 96), 95)) * 4;
          luminance += .2126 * linear(pixels[i] / 255) + .7152 * linear(pixels[i + 1] / 255) + .0722 * linear(pixels[i + 2] / 255);
        }
        luminance /= 9;
        icon.style.color = (luminance + .05) / .05 >= 1.05 / (luminance + .05) ? '#000' : '#fff';
      }
      function schedule() { if (!pending) { pending = true; requestAnimationFrame(update); } }
      function pixelsFrom(image) {
        canvas.width = 96;
        context.drawImage(image, 0, 0, 96, 96);
        return context.getImageData(0, 0, 96, 96).data;
      }
      const preview = new Image();
      preview.onload = () => { try { previewPixels = pixelsFrom(preview); schedule(); } catch (_) {} };
      preview.src = getComputedStyle(document.documentElement).getPropertyValue('--preview').trim().slice(5, -2);
      function loaded() { try { heroPixels = pixelsFrom(hero); } catch (_) {} schedule(); }
      if (hero.complete && hero.naturalWidth) loaded();
      else hero.addEventListener('load', loaded, { once: true });
      hero.addEventListener('error', schedule, { once: true });
      window.addEventListener('resize', schedule, { passive: true });
      window.visualViewport?.addEventListener('resize', schedule, { passive: true });
      if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(scene);
    })();
  </script>
