      --w: 100vw;
      --h: 100vh;
      --pad: 16px;
      
      --size: min(max(var(--w), var(--h), 1000px),
        calc((var(--w) - 2 * var(--pad)) / .26),
        calc((var(--h) - 2 * var(--pad)) / .17));
      --crop-x: max(0px, calc(var(--size) - var(--w)));
      --crop-y: max(0px, calc(var(--size) - var(--h)));
      --cut-left: calc(
        min(var(--crop-x), var(--size) * .48) * .04 / .48 +
        clamp(0px, var(--crop-x) - var(--size) * .48, var(--size) * .16) * .035 / .16 +
        clamp(0px, var(--crop-x) - var(--size) * .64, var(--size) * .10) * .055 / .10);
      --cut-top: calc(
        min(var(--crop-y), var(--size) * .66) * .38 / .66 +
        clamp(0px, var(--crop-y) - var(--size) * .66, var(--size) * .105) +
        clamp(0px, var(--crop-y) - var(--size) * .765, var(--size) * .065) * .035 / .065);
      --frame-x: clamp(calc(var(--pad) - var(--size) * .13),
        calc(max(0px, (var(--w) - var(--size)) / 2) - var(--cut-left)),
        calc(var(--w) - var(--pad) - var(--size) * .39));
      --frame-y: clamp(calc(var(--pad) - var(--size) * .52),
        calc(max(0px, (var(--h) - var(--size)) / 2) - var(--cut-top)),
        calc(var(--h) - var(--pad) - var(--size) * .69));

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #b39162; }
    body { position: fixed; inset: 0; font-family: system-ui, sans-serif; }
    main { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }
    
    .backdrop { position: absolute; inset: -48px; z-index: -1; pointer-events: none;
      --back-width: calc(max(var(--w), var(--size)) + 96px);
      --back-x: min(0px, var(--frame-x));
      background-image: var(--preview), var(--edge-top), var(--edge-bottom);
      background-size: var(--back-width) var(--size),
        var(--back-width) max(0px, calc(var(--frame-y) + 48px)),
        var(--back-width) max(0px, calc(100% - var(--frame-y) - var(--size) - 48px));
      background-position: var(--back-x) calc(var(--frame-y) + 48px),
        var(--back-x) top, var(--back-x) bottom;
      background-repeat: no-repeat; filter: blur(16px); }
    .scene { position: absolute; width: var(--size); height: var(--size);
      left: var(--frame-x); top: var(--frame-y);
      background: var(--preview) center / 100% 100% no-repeat;
    }
    .plasma { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .paint-ready { touch-action: none; }
    .paint-ready .hero { user-select: none; -webkit-user-drag: none; }
    .email { z-index: 3; }
    .hero { display: block; width: 100%; height: 100%; object-fit: contain; color: transparent; }
    .email { position: absolute; left: 16%; top: 64.5%; width: 20%; height: 4.5%;
      min-height: 44px; transform: translateY(-2px); border-radius: 5px;
      color: #722473; text-decoration: none; -webkit-tap-highlight-color: rgb(114 36 115 / .18); }
    .email:focus { outline: 3px solid #722473; outline-offset: 4px; box-shadow: 0 0 0 7px #fff; }
    .email:focus:not(:focus-visible) { outline: none; box-shadow: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    .linkedin { position: fixed; left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2;
      width: 44px; height: 44px; display: grid; place-items: center;
      color: #fff; border-radius: 4px; }
    .linkedin svg { width: 22px; height: 22px; fill: currentColor; }
    .linkedin:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    .failed .scene { visibility: hidden; }
    .failed .intro, .failed .intro * { position: static; width: auto; height: auto; margin: 0;
      overflow: visible; clip: auto; clip-path: none; white-space: normal; }
    .failed .intro { position: absolute; inset: max(16px, env(safe-area-inset-top)) 16px auto;
      padding: clamp(12px, 4vw, 32px); max-width: 38rem; border-radius: 8px;
      background: #fff; color: #442b44; }
    .failed .intro h1 { font-size: clamp(24px, 6vw, 40px); margin-bottom: 8px; color: #aa55aa; }
    .failed .intro p { font-size: 16px; line-height: 1.4; color: #434343; }
    .fallback-contact, .fallback-linkedin { display: none; }
    .failed .fallback-contact, .failed .fallback-linkedin { display: block;
      width: fit-content; padding-block: 12px; color: #aa55aa; }
    @media (forced-colors: active) {
      .linkedin { color: LinkText !important; }
      .email { outline: 2px solid LinkText; }
      .email span { position: static; width: auto; height: auto; clip-path: none; white-space: normal;
        color: LinkText; background: Canvas; }
    }
